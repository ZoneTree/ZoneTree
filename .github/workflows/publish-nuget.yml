name: Publish Nuget Package

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'When you press run workflow, the nuget package will be published.'
        default: 'I understand.'

# Trusted publishing: NuGet/login exchanges the workflow's OIDC token for a short-lived API key.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
            10.0.x
            9.0.x
            8.0.x
            7.0.x
            6.0.x
      - name: Display dotnet version
        run: dotnet --version
      - name: Restore dependencies
        working-directory: ./src
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ./src
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: ./src
      - name: Pack
        run: dotnet pack ZoneTree/ZoneTree.csproj --no-build --configuration Release
        working-directory: ./src
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: koculu
      - name: Publish the package to nuget.org
        run: dotnet nuget push ZoneTree/bin/Release/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
        working-directory: ./src
